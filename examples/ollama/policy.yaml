version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /etc]
  read_write: [/tmp, /dev/null]

landlock:
  compatibility: best_effort

network_policies: {}

inference:
  providers: [local]   # host.cautem.internal :11434,1234,8000,8080

credentials:
  env_allow: [TERM, LANG]
  write_to_disk: false
