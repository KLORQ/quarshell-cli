      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            quarshell-*/go.sum
            quarshell-slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...

      - name: Build and smoke proxy companion image
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          GOWORK="${{ github.workspace }}/go.work" CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -C quarshell-cli -o "$stage/cautem" ./cmd/cautem
          cp quarshell-cli/policies/default.yaml "$stage/default.yaml"
          docker build --platform linux/amd64 -t quarshell-proxy:ci \
            -f quarshell-cli/docker/proxy/Dockerfile "$stage"
          docker run --platform linux/amd64 --rm --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            --entrypoint /usr/local/bin/cautem quarshell-proxy:ci proxy --help >/dev/null

