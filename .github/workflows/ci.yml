name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quarshell-cli
    steps:

      - name: Checkout quarshell-cli
        uses: actions/checkout@v4
        with:
          path: quarshell-cli

      - name: Checkout quarshell-core
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-core
          ref: v0.4.2
          path: quarshell-core

      - name: Checkout quarshell-display
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-display
          ref: v0.1.1
          path: quarshell-display

      - name: Checkout quarshell-driver
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-driver
          ref: v0.1.1
          path: quarshell-driver

      - name: Checkout quarshell-providers
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-providers
          ref: v0.1.1
          path: quarshell-providers

      - name: Checkout quarshell-proxy
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proxy
          ref: v0.1.1
          path: quarshell-proxy

      - name: Checkout quarshell-runtime
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-runtime
          ref: v0.1.1
          path: quarshell-runtime

      - name: Checkout quarshell-sdk
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-sdk
          ref: v0.1.1
          path: quarshell-sdk

      - name: Checkout quarshell-proto
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proto
          ref: v0.2.2
          path: quarshell-proto

      - name: Checkout quarshell-slogx
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-slogx
          ref: v0.1.5
          path: quarshell-slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            modules=()
            for d in quarshell-*; do
              [[ -f "$d/go.mod" ]] && modules+=("$d")
            done
            for d in "${modules[@]}"; do
              echo "  ./$d"
            done
            echo ')'
            echo 'replace ('
            for d in "${modules[@]}"; do
              module="$(sed -n 's/^module[[:space:]][[:space:]]*//p' "$d/go.mod" | head -n 1)"
              [[ -n "$module" ]] || continue
              for source in "${modules[@]}"; do
                awk -v module="$module" '$1 == module && $2 ~ /^v[0-9]/ { print $2 }; $1 == "require" && $2 == module && $3 ~ /^v[0-9]/ { print $3 }' "$source/go.mod"
              done | sort -u | while IFS= read -r version; do
                printf '  %s %s => ./%s\n' "$module" "$version" "$d"
              done
            done
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            quarshell-*/go.sum
            quarshell-slogx/go.sum
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

