        with:
          repository: KLORQ/quarshell-proxy
          ref: v0.1.1
          path: quarshell-proxy

      - name: Checkout quarshell-proto candidate
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proto
          ref: v0.2.2
          path: quarshell-proto

      - name: Checkout quarshell-slogx candidate
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-slogx
          ref: v0.1.5
          path: quarshell-slogx

      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            modules=()
            for d in quarshell-*; do
              [[ -f "$d/go.mod" ]] && modules+=("$d")
            done
            for d in "${modules[@]}"; do
              echo "  ./$d"
            done
            echo ')'
            echo 'replace ('
            for d in "${modules[@]}"; do
              module="$(sed -n 's/^module[[:space:]][[:space:]]*//p' "$d/go.mod" | head -n 1)"
              [[ -n "$module" ]] || continue
              for source in "${modules[@]}"; do
                awk -v module="$module" '$1 == module && $2 ~ /^v[0-9]/ { print $2 }; $1 == "require" && $2 == module && $3 ~ /^v[0-9]/ { print $3 }' "$source/go.mod"
              done | sort -u | while IFS= read -r version; do
                printf '  %s %s => ./%s\n' "$module" "$version" "$d"
              done
            done
            echo ')'
          } > go.work

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            quarshell-*/go.sum
            quarshell-slogx/go.sum

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          workdir: quarshell-cli
          args: release --snapshot --clean --skip=publish
        env:
          GOTOOLCHAIN: local

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.0
        with:
          syft-version: v1.42.3

      - name: Generate and validate SPDX SBOMs for release archives
        working-directory: quarshell-cli
        env:
          SYFT_BIN: ${{ steps.syft.outputs.cmd }}
        run: bash scripts/generate-release-sboms.sh "$SYFT_BIN" dist

      - name: Verify archive layout and install.sh
        working-directory: quarshell-cli
        shell: bash
        run: |
          set -euo pipefail
          for a in dist/cautem_Linux_x86_64.tar.gz dist/cautem_Darwin_arm64.tar.gz; do
            arch=amd64; [[ "$a" == *arm64* ]] && arch=arm64
            list="$(tar -tzf "$a")"
            for f in cautem quarshell-gateway \
                     "libexec/cautem/linux-${arch}/cautem" \
                     "libexec/cautem/linux-${arch}/cautem-init" \
                     "libexec/cautem/linux-${arch}/cautem-sshd"; do
              grep -qx "\(\./\)\?${f}" <<<"$list" || { echo "missing ${f} in ${a}"; echo "$list"; exit 1; }
            done
            for f in providers/claude-code.yaml providers/cursor.yaml providers/github.yaml providers/nvidia.yaml; do
              grep -qx "\(\./\)\?${f}" <<<"$list" || { echo "missing ${f} in ${a}"; echo "$list"; exit 1; }
            done
          done
          gateway_list="$(tar -tzf dist/quarshell-gateway_Linux_x86_64.tar.gz)"
          grep -qx "\(\./\)\?providers/claude-code.yaml" <<<"$gateway_list" || { echo "missing built-in profiles in standalone gateway archive"; echo "$gateway_list"; exit 1; }
          unzip -l dist/cautem_Windows_x86_64.zip | grep -q "libexec/cautem/linux-amd64/cautem-sshd"
          unzip -l dist/cautem_Windows_x86_64.zip | grep -q "providers/claude-code.yaml"

          mkdir -p /tmp/rel && ln -s "$PWD/dist" /tmp/rel/snapshot
          CAUTEM_RELEASE_URL=file:///tmp/rel CAUTEM_VERSION=snapshot \
            CAUTEM_INSTALL_DIR=/tmp/prefix/bin sh ./install.sh
          test -x /tmp/prefix/bin/cautem
          test -x /tmp/prefix/bin/quarshell-gateway
          test -f /tmp/prefix/bin/providers/claude-code.yaml
          test -x /tmp/prefix/libexec/cautem/linux-amd64/cautem-sshd
          /tmp/prefix/bin/cautem provider profile show claude-code | grep -q '^id: claude-code$'
          /tmp/prefix/bin/cautem version
