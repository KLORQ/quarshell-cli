            quarshell-slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - name: Test (race + coverage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Test (race)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -count=1 ./...
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./quarshell-cli/coverage.txt
          flags: unittests
          name: codecov-quarshell-cli
          fail_ci_if_error: false

  release-dry-run:
    name: Release archives + install.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quarshell-cli
        uses: actions/checkout@v4
        with:
          path: quarshell-cli
          fetch-depth: 0

      - name: Checkout quarshell-driver candidate
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-driver
          ref: v0.1.1
          path: quarshell-driver

      - name: Checkout quarshell-gateway candidate
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-gateway
          ref: v0.1.1
          path: quarshell-gateway

      - name: Checkout quarshell-runtime candidate
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-runtime
          ref: v0.1.1
          path: quarshell-runtime

